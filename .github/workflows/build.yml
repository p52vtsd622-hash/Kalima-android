name: Build Kalima APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kalima-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4
      - name: Unpack the app project
        run: |
          mkdir -p project
          unzip -q kalima-android.zip -d project
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Restore the permanent Kalima signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KALIMA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add Kalima signing secrets first. See START-HERE.md. No replacement key will be generated."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kalima.keystore"
          chmod 600 "$RUNNER_TEMP/kalima.keystore"
      - name: Build and check Kalima
        working-directory: project
        env:
          KALIMA_KEYSTORE_PATH: ${{ runner.temp }}/kalima.keystore
          KALIMA_KEYSTORE_PASSWORD: ${{ secrets.KALIMA_KEYSTORE_PASSWORD }}
          KALIMA_KEY_ALIAS: ${{ secrets.KALIMA_KEY_ALIAS }}
          KALIMA_KEY_PASSWORD: ${{ secrets.KALIMA_KEY_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: Prepare and verify the signed APK
        env:
          KALIMA_KEYSTORE_PASSWORD: ${{ secrets.KALIMA_KEYSTORE_PASSWORD }}
          KALIMA_KEY_ALIAS: ${{ secrets.KALIMA_KEY_ALIAS }}
          KALIMA_KEY_PASSWORD: ${{ secrets.KALIMA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for setting in KALIMA_KEYSTORE_PASSWORD KALIMA_KEY_ALIAS KALIMA_KEY_PASSWORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing signing secret: $setting. Keep using the original permanent Kalima key."
              exit 1
            fi
          done
          mapfile -d '' apks < <(find project/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one release APK, found ${#apks[@]}. Check the Build and check Kalima step."
            find project/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::Android APK signing tool is missing."
            exit 1
          fi
          "$apksigner" sign --ks "$RUNNER_TEMP/kalima.keystore" \
            --ks-key-alias "$KALIMA_KEY_ALIAS" \
            --ks-pass env:KALIMA_KEYSTORE_PASSWORD \
            --key-pass env:KALIMA_KEY_PASSWORD \
            --out Kalima.apk "${apks[0]}"
          "$apksigner" verify --verbose Kalima.apk
          test -s Kalima.apk
      - name: Keep the APK as a download on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Kalima-APK
          path: Kalima.apk
          if-no-files-found: error
      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Kalima.apk --clobber
            gh release edit latest --title "Kalima latest build" --notes "Newest build of the Kalima Android app." --target "${{ github.sha }}"
          else
            gh release create latest Kalima.apk --title "Kalima latest build" --notes "Newest build of the Kalima Android app." --target "${{ github.sha }}"
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kalima.keystore"
