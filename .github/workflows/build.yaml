name: Build Kalima APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Unpack the app project
        run: |
          mkdir -p project
          unzip -q kalima-android.zip -d project
          # If iOS nested the files inside a subfolder, move them up
          if [ ! -f "project/settings.gradle.kts" ]; then
            mv project/*/* project/ 2>/dev/null || true
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK as a download on the run page
        uses: actions/upload-artifact@v4
        with:
          name: Kalima-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Kalima.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Kalima.apk --title "Kalima latest build" --notes "Newest build of the Kalima Android app." --target "${{ github.sha }}"

